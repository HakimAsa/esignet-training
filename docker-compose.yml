services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-esignet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-esignet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prod-like build of the app itself. For day-to-day development, run
  # `npm run db:up` + `npm run dev` on the host instead (faster hot reload).
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override .env's NODE_ENV/DATABASE_URL: this runs the production image
      # against the "postgres" service hostname, not the host-facing values in .env.
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-esignet}?schema=public
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
