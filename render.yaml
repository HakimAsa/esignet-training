# Render Blueprint — see https://render.com/docs/blueprint-spec
# `plan: free` reflects Render's offering at the time this was written; check
# the dashboard if Render rejects it on apply.
#
# Postgres is NOT provisioned here: Render's managed Postgres has no free
# plan, so this points at an external free-tier Postgres instead (e.g. Neon,
# Supabase) — set DATABASE_URL to its connection string when prompted below.
services:
  - name: esignet-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./prod.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Connection string from your external Postgres provider (Neon, Supabase,
      # etc.). If using Supabase, use the "Session pooler" host, not the direct
      # "db.<ref>.supabase.co" one (IPv6-only, often unreachable). Append
      # ?sslmode=require&uselibpqcompat=true — without uselibpqcompat, current
      # pg treats sslmode=require as full cert verification, which fails
      # against most managed Postgres providers' certs ("self-signed
      # certificate in certificate chain").
      - key: DATABASE_URL
        sync: false

      # Your deployed frontend's origin, e.g. https://your-app.vercel.app —
      # set after the frontend is deployed.
      - key: CORS_ORIGIN
        sync: false

      # eSignet (MOSIP) OIDC client config — see README.md's "eSignet (MOSIP)
      # login" section. Static endpoint URLs are safe to hardcode (not secret);
      # the client-specific values below must be filled in per environment.
      # Must exactly match the "iss" claim eSignet actually puts in its
      # id_tokens (verified against a real one) — not just the bare host.
      - key: ESIGNET_ISSUER
        value: https://esignet.benin.mosip.net/v1/esignet
      - key: ESIGNET_TOKEN_URL
        value: https://esignet.benin.mosip.net/v1/esignet/oauth/v2/token
      - key: ESIGNET_USERINFO_URL
        value: https://esignet.benin.mosip.net/v1/esignet/oidc/userinfo
      - key: ESIGNET_JWKS_URL
        value: https://esignet.benin.mosip.net/.well-known/jwks.json
      - key: ESIGNET_ALLOW_UNVERIFIED_USERINFO
        value: "false"

      # Must exactly match what's registered with eSignet as this client's
      # redirect_uri, AND match the frontend's VITE_ESIGNET_REDIRECT_URI
      # exactly. This must be the FRONTEND's own origin (e.g.
      # https://vue-upload-form.onrender.com/auth/callback), not this
      # backend's — the frontend's nginx proxies /auth/* here server-side, so
      # the browser never leaves the frontend's origin. Required because
      # onrender.com is on the Public Suffix List: this backend and the
      # frontend are different *sites*, so a cookie set via a direct
      # cross-site call to this backend is third-party and can be dropped by
      # the browser's tracking protections.
      - key: ESIGNET_REDIRECT_URI
        sync: false
      - key: ESIGNET_CLIENT_ID
        sync: false
      # PKCS8 PEM — see `npm run esignet:generate-key`. Paste with real
      # newlines; Render's dashboard textarea preserves them.
      - key: ESIGNET_PRIVATE_KEY
        sync: false
      - key: ESIGNET_KEY_ID
        sync: false

      # Render generates and stores this random value itself on first deploy.
      - key: ESIGNET_SESSION_SECRET
        generateValue: true
